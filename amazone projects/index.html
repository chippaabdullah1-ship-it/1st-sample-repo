<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="navbar">
            <div class="navlogo border">
                <div class="logo"></div>
            </div>
            <div class="navaddress border">
                <p class="add1">Deliver to</p>
                <div class="addressicon">
<i class="fa-solid fa-location-dot"></i>
                    <p class="add2">pakistan</p>
                </div>
            </div>
            <div class="navsearch">
                <select class="searchselect">
                    <option>All</option>
                </select>
                <input placeholder="Search Amazon" class="searchinput">
                <div class="searchicon">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
            </div>
            <div class="navsign border">
            <p><span>Hello,sign in</span></p>
            <p class="nav2">account & list</p>
        </div>

        <div class="navreturn border">
            <p><span>Return</span></p>
            <p class="nav2"> & Orders</p>
        </div>

        <div class="navcard border">
            <i class="fa-solid fa-cart-shopping"></i>
            cart
        </div>
        </div>


        <div class="panel">
            <div class="panelall border">
<i class="fa-solid fa-bars"></i>
                All
            </div>
            <div class="panelopt ">
                <p class="border">Today Deal</p>
                <p class="border">Customer service </p>
                <p class="border">Registry</p>
                <p class="border">Gift card</p>
                <p class="border">Sell</p>
            </div>
            <div class="paneldeals border">
                Shop Deals in Electronics
            </div>
        </div>
    </header>
    <div class="herosection">
        <div class="heromsg">
            
        </div>
    </div>
</body>
</html>
